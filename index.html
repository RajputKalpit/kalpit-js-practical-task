<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalpit JS Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main>
        <div class="filters">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <div class="ai-assistant mt-3">
    <div id="chatMessages"></div>
    <div class="chat-input d-flex justify-content-center">
        <input
            type="text"
            id="userInput"
            placeholder="Ask me about hotels..."
            class="form-control"
        />
        <button id="sendBtn" class="btn btn-primary btn-lg">
            Send
        </button>
    </div>
</div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <div class=" d-flex gap-3 justify-content-center p-4">
                            <div class="resort">
                                <p>Resort Type</p>
                                <select id="sel-resorts" class="form-select form-select-lg mb-3" aria-label=".form-select-lg example" data-filters></select>
                            </div>
                            <div class="age">
                                <p>Age</p>
                                <select id="sel-age" class="form-select form-select-lg mb-3" aria-label=".form-select-lg example" data-filters></select>
                            </div>
                            <div class="season">
                                <p>season</p>
                                <select id="sel-season" class="form-select form-select-lg mb-3" aria-label=".form-select-lg example" data-filters></select>
                            </div>
                            <div class="sort by">
                <p>Sort By</p>
                <select id="sel-sort" class="form-select form-select-lg mb-3" aria-label=".form-select-lg example">
                    <option value="Price- Low to High">Price- Low to High</option>
                    <option value="Price – High to Low">Price – High to Low</option>
                    <option value="A to Z">A to Z</option>
                    <option value="Z to A">Z to A</option>
                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="entity d-flex justify-content-center fw-bolder">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <div class="d-flex justify-content-between mb-2">
                            <div class="entity__selected d-flex gap-2">
                                <button class="entity__resort border bg-light px-4 py-2 rounded d-none gap-2 align-items-center" data-reset-resort data-reset><span class="pe-none entity__resort-text"></span><span class="pe-none fw-bolder"> X </span></button>
                                <button class="entity__age border bg-light px-4 py-2 rounded d-none gap-2 align-items-center" data-reset-age data-reset><span class="pe-none entity__age-text"></span><span class="pe-none fw-bolder"> X </span></button>
                                <button class="entity__season border bg-light px-4 py-2 rounded d-none gap-2 align-items-center" data-reset-season data-reset><span class="pe-none entity__season-text"></span><span class="pe-none fw-bolder"> X </span></button>
                            </div>
                            <div class="entity__default d-flex align-items-center gap-5">
                                <button class="entity__print-pdf text-uppercase border-0 bg-transparent fw-bold fs-6">Print List</button>
                                <p class="mb-0"><span class="cards-count"></span> Resorts Available</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="container">
            <div class="row">
                <div class="col-12">
                  <div class="results">
                  </div>
                </div>
            </div>
        </div>
        
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="./script.js" defer></script>
</body>
</html>
